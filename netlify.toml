[build]
  # The app lives in client/. npm ci gives a clean install (including
  # devDependencies like vite), replacing the incomplete node_modules
  # folder committed to the repo.
  command = "npm ci --prefix client --include=dev && npm run build --prefix client"
  publish = "client/dist"
  
  [[redirects]]
  from = "/api/*"
  to = "https://pukparking.onrender.com/api/:splat"
  status = 200

  [[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200