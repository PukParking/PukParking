<html>
<head>
  <meta charset="UTF-8"/> <!-- sets the character encoding, allowing the use of special character to not appear as just text -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!-- allows for the website to be able to be viewed correctly on mobile devices -->
  <title> User Parked Confirmation</title>

  <link rel="stylesheet" href="user-parked-confirmation.css" /> <!-- the link to this page's Cascading Style Sheets (CSS) file -->
</head>
<body>

  <div class="card">

    <!-- Logo placeholder -->
    <div class="logo-circle">LOGO</div>

    <h1 id="arrivedMessage">Arrived!</h1> <!-- Arrival Message displayed when the user arrived at the parking spot -->

    <!-- Rate Parking Card-->
    <section class="rating-card">
      <h2>Rate Parking</h2>

      <!-- 5 star buttons -->
      <div id="stars" class="stars">
        <button class="star" type="button" aria-label="Rate 1 star">☆</button>
        <button class="star" type="button" aria-label="Rate 2 stars">☆</button>
        <button class="star" type="button" aria-label="Rate 3 stars">☆</button>
        <button class="star" type="button" aria-label="Rate 4 stars">☆</button>
        <button class="star" type="button" aria-label="Rate 5 stars">☆</button>
      </div>

      <!-- Comment section -->
      <label for="comment">Comment:</label>
      <textarea id="comment" rows="4" placeholder="Anything you'd like to tell us about this parking area?"></textarea>
    </section>

    <button id="doneBtn" class="btn btn-primary">Done</button> <!-- Done button -->

  </div>

  <!-- Script tags, indicating the exact order which the JavaScript files load -->
  <script src="config.js"></script> <!-- defines the API_BASE_URL / MAPBOX_TOKEN -->
  <script src="user-parked-confirmation.js"></script> <!-- defines the page's JavaScript file itself-->
</body>
</html>
